name: Daily NAV Tracker

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill YTD historical data'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  track-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NAV tracker
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python nav_tracker.py --backfill
          else
            python nav_tracker.py
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          git diff --staged --quiet || git commit -m "Daily NAV update $(date +%Y-%m-%d)"
          git push
